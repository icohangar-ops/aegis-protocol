[project]
name = "aegis-protocol"
version = "0.1.0"
description = "Autonomous AI Circuit breaker for DeFi — multi-agent swarm verifies exploits via Tavily OSINT before triggering on-chain pause()"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "web3>=7.0",
    "tavily-python>=0.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
